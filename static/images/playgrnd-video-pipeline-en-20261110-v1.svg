  <title id="title">From the pitch to a linked goal</title>
  <desc
    id="desc"
  >1. Record the match: Hrvoje sets up Ballr and records the panorama. Ballr · 6976 × 2160 · field audio; 2. Manually upload to Drive: Hrvoje transfers the original recording to Google Drive. Manual transfer · original preserved; 3. Start the ChatGPT job: Hrvoje sends the Drive link, PLAYGRND match link and requested outputs. Two source links + editorial instructions; 4. Prepare the working job: ChatGPT retrieves the source and match facts with connected tools; prepares the job. Drive tools · ffprobe · cached JSON; 5. Find events and plan the camera: Local analysis proposes timestamps and framing. ChatGPT inspects evidence and corrects uncertain parts. Core ML / YOLO11 · scoreboard + audio Python · NumPy · SciPy · camera profile; 6. Render and run technical QA: Tools produce full match, highlights and goals; check cadence, audio, duration and decoding. Swift / Metal · VideoToolbox · Pillow FFmpeg / libx264 · ffprobe; 7. Assistant review and corrections: ChatGPT inspects sampled output frames and QA receipts, then adjusts timing, framing or graphics. Assistant + local tools · iterate before handoff; 8. Watch the local review link: Hrvoje watches the encoded videos in a private LAN player. He requests changes or approves exact files. Local HTTP player · seeking / byte ranges; 9. Publish and attach to the match: After explicit approval, ChatGPT uses tools to upload, verify visibility and connect videos to match / event IDs. Platform APIs or browser · YouTube / Drive Selected social clips · PLAYGRND video links</desc>
